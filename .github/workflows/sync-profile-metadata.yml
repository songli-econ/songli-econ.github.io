name: Sync profile metadata
on:
  push:
    branches: [main]
    paths:
      - index.html
      - scripts/sync-profile-metadata.py
      - .github/workflows/sync-profile-metadata.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sync-profile-metadata
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - run: |
          git pull --ff-only origin main
          python3 scripts/sync-profile-metadata.py
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Sync profile modification metadata'
          git push origin HEAD:main
